<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MiTasaYa | Tu mejor tasa, hoy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MiTasaYa te muestra dónde pagan mejor hoy para enviar dinero a Colombia. Próximamente.">

  <!-- Widget dólar Colombia -->
  <script src="https://www.dolar-colombia.com/widget.js"></script>
  <script src="https://www.dolar-colombia.com/widget.js?t=3"></script>
</head>

<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background:#ffffff; color:#111; padding:40px; max-width:700px; margin:auto;">

  <h1>MiTasaYa</h1>
  <p><strong>Tu mejor tasa, hoy.</strong></p>

  <p id="usdCop" style="font-size:20px; font-weight:bold;">
    cargando...
  </p>

  <p style="font-size:14px; color:#777;">
    Se actualiza automáticamente. Valor informativo.
  </p>

  <p>
    Estamos trabajando para mostrarte de forma clara y simple dónde pagan mejor hoy para enviar dinero a Colombia.
  </p>

  <p><em>Próximamente.</em></p>

  <script>
    async function loadUsdCop() {
      const el = document.getElementById('usdCop');

      try {
        const url = 'https://api.frankfurter.dev/v1/latest?base=USD&symbols=COP';
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error('http ' + r.status);

        const data = await r.json();
        const rate = data && data.rates && data.rates.COP;
        if (!rate) throw new Error('missing rate');

        el.innerText = rate.toLocaleString('es-CO', {
          style: 'currency',
          currency: 'COP',
          maximumFractionDigits: 0
        });
      } catch (e) {
        el.innerText = 'no disponible';
        console.error(e);
      }
    }

    loadUsdCop();
  </script>

</body>
</html>
