<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>MiTasaYa | Tu mejor tasa, hoy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MiTasaYa te muestra el dólar hoy y pronto te dirá dónde pagan mejor para enviar dinero a Colombia." />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    :root{
      /* LATAM FRIENDLY: cálido, confiable, simple */
      --bg: #FBF7F2;          /* crema suave */
      --surface: #FFFFFF;     /* tarjetas */
      --surface2: #FFFDF9;    /* fondo interno sutil */

      --text: #102A2A;        /* verde carbón */
      --muted: #5C6B6B;       /* gris verdoso */
      --line: #E9E1D7;        /* separadores cálidos */

      --accent: #0EA5A4;      /* turquesa */
      --accent2: #0B8F8E;

      --warm: #F59E0B;        /* toque cálido para badges */
      --warmSoft: rgba(245,158,11,.14);

      --radius: 18px;
      --shadow: 0 10px 22px rgba(16, 42, 42, .06);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 540px at 12% 8%, rgba(14,165,164,.10), transparent 62%),
        radial-gradient(860px 520px at 90% 12%, rgba(245,158,11,.10), transparent 60%),
        var(--bg);
      color: var(--text);
    }

    a{ color: inherit; text-decoration:none; }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 16px 46px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 0;
    }

    .logo{
      width:40px;
      height:40px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), rgba(34,197,94,.55));
      box-shadow: 0 12px 18px rgba(14,165,164,.22);
      flex: 0 0 auto;
    }

    .brandTitle{
      display:flex;
      flex-direction:column;
      min-width: 0;
    }

    .brandTitle h1{
      margin:0;
      font-size:15px;
      letter-spacing:.2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .brandTitle p{
      margin:2px 0 0 0;
      font-size:12px;
      color: var(--muted);
    }

    .badge{
      font-size:12px;
      color: #7A4A00;
      background: var(--warmSoft);
      border: 1px solid rgba(245,158,11,.28);
      padding: 8px 10px;
      border-radius: 999px;
      white-space: nowrap;
      font-weight: 800;
    }

    .hero{
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .hero h2{
      margin:0 0 6px 0;
      font-size: 26px;
      line-height:1.15;
      letter-spacing: -0.2px;
    }

    .hero p{
      margin:0;
      max-width: 72ch;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .heroActions{
      margin-top: 12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(14,165,164,.22);
      background: linear-gradient(135deg, var(--accent), rgba(34,197,94,.60));
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 12px 18px rgba(14,165,164,.18);
    }

    .btn:hover{ filter: brightness(.98); }

    .btnGhost{
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
      font-weight: 800;
    }

    .btnGhost:hover{ background: rgba(255,255,255,.55); }

    .heroInputs{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .field{
      flex: 1 1 220px;
      min-width: 220px;
    }

    .label{
      font-size:12px;
      color: var(--muted);
      margin-bottom:6px;
      font-weight: 800;
    }

    .input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.9);
      outline:none;
      color: var(--text);
    }

    .input:focus{
      border-color: rgba(14,165,164,.45);
      box-shadow: 0 0 0 4px rgba(14,165,164,.10);
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    @media (min-width: 900px){
      .grid{
        grid-template-columns: 1.1fr .9fr;
        align-items:start;
      }
    }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .cardTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }

    .cardTitle h3{
      margin:0;
      font-size: 14px;
      letter-spacing:.2px;
    }

    .small{
      font-size:12px;
      color: var(--muted);
    }

    .rateRow{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface2);
    }

    .rateValue{
      font-size: 26px;
      font-weight: 950;
      letter-spacing:.2px;
    }

    .rateMeta{
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      color: rgba(16,42,42,.65);
      white-space: nowrap;
    }

    .widgetCenter{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow-x:auto;
      padding: 6px 0;
    }
    .widgetCenter *{
      margin-left:auto !important;
      margin-right:auto !important;
      float:none !important;
      text-align:center !important;
    }

    .compareHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .compareHint{
      font-size:12px;
      color: var(--muted);
    }

    .providers{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .provider{
      border: 1px solid var(--line);
      background: var(--surface2);
      border-radius: 16px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .pLeft{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 0;
    }

    .pName{
      font-weight: 950;
      font-size: 14px;
      letter-spacing:.2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .pMeta{
      font-size: 12px;
      color: var(--muted);
    }

    .pRight{
      display:flex;
      align-items:center;
      gap:10px;
      flex: 0 0 auto;
    }

    .pChip{
      font-size: 12px;
      font-weight: 900;
      padding: 7px 9px;
      border-radius: 999px;
      border: 1px solid rgba(14,165,164,.18);
      color: var(--accent2);
      background: rgba(14,165,164,.10);
      white-space: nowrap;
    }

    .pChipWarm{
      background: rgba(245,158,11,.14);
      border: 1px solid rgba(245,158,11,.28);
      color:#7A4A00;
    }

    .pBtn{
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid rgba(14,165,164,.22);
      background: var(--accent);
      color:#fff;
      font-weight: 950;
      font-size: 12px;
      white-space: nowrap;
    }

    .pBtn:hover{ filter: brightness(.98); }

      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--
