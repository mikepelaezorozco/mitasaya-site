<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>MiTasaYa | Tu mejor tasa, hoy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MiTasaYa muestra el dólar hoy en Colombia. Próximamente: comparación clara para enviar dinero." />

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#f3f4f6;
      color:#111827;
    }

    .wrap{
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    h1{
      margin:0 0 18px 0;
      font-size:22px;
      font-weight:600;
    }

    .card{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:18px;
    }

    .title{
      margin:0 0 12px 0;
      font-size:14px;
      font-weight:600;
    }

    .widgetCenter{
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      overflow-x:auto;
      padding: 8px 0;
    }

    .widgetCenter *{
      margin-left:auto !important;
      margin-right:auto !important;
    }

    .widgetCenter table{
      margin-left:auto !important;
      margin-right:auto !important;
    }

    .widgetCenter iframe{
      display:block;
      margin:0 auto !important;
    }

    .note{
      margin:12px 0 0 0;
      font-size:12px;
      color:#6b7280;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>MiTasaYa</h1>

    <div class="card">
      <p class="title">Dólar hoy (USD a COP)</p>

      <div class="widgetCenter">
        <!-- Widget dólar Colombia (se deja tal cual) -->
        <script src="https://www.dolar-colombia.com/widget.js"></script>
        <script src="https://www.dolar-colombia.com/widget.js?t=3"></script>
      </div>

      <p class="note">Se actualiza automáticamente. Valor informativo.</p>
    </div>
  </div>
</body>
</html>
